  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle - 2D SVG Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87ceeb 0%, #bde5f8 50%, #e0f2fe 70%, #d8ebd6 70%, #a1d99b 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 18px;
      font-size: 1.8rem;
      color: #1e3a8a;
      text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 950px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .svg-wrapper {
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(to bottom, #7fc8f8 0%, #c4e4ff 58%, #85b068 58%, #578a3c 100%);
      border: 4px solid #ffffff;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 22px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .speed-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }

    /* CSS Keyframe Animations */
    @keyframes wheelSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pedalSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bobbing {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(-1.5deg);
      }
    }

    @keyframes beakPouchBounce {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(1.08) skewX(2deg);
      }
    }

    @keyframes wingFlap {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-10deg);
      }
    }

    @keyframes tailWiggle {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(12deg);
      }
    }

    @keyframes cloudMoveSlow {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-1000px);
      }
    }

    @keyframes roadMove {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-400px);
      }
    }

    @keyframes foliageMove {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-800px);
      }
    }

    /* Animation class assignments */
    .wheel-spokes {
      animation: wheelSpin 1.2s linear infinite;
    }
    .front-wheel {
      transform-origin: 640px 380px;
    }
    .back-wheel {
      transform-origin: 260px 380px;
    }

    .crankset {
      transform-origin: 430px 380px;
      animation: pedalSpin 1.2s linear infinite;
    }

    .pelican-rider {
      animation: bobbing 0.6s ease-in-out infinite;
      transform-origin: 450px 330px;
    }

    .pelican-wing {
      animation: wingFlap 1.2s ease-in-out infinite;
      transform-origin: 410px 225px;
    }

    .beak-pouch {
      animation: beakPouchBounce 0.6s ease-in-out infinite;
      transform-origin: 560px 170px;
    }

    .pelican-tail {
      animation: tailWiggle 0.6s ease-in-out infinite;
      transform-origin: 340px 260px;
    }

    .clouds {
      animation: cloudMoveSlow 25s linear infinite;
    }

    .bushes {
      animation: foliageMove 8s linear infinite;
    }

    .road-lines {
      animation: roadMove 0.8s linear infinite;
    }

    /* Leg IK animated via simple complementary rocking */
    @keyframes thighFront {
      0% { transform: rotate(18deg); }
      50% { transform: rotate(-24deg); }
      100% { transform: rotate(18deg); }
    }
    @keyframes calfFront {
      0% { transform: rotate(-20deg); }
      50% { transform: rotate(26deg); }
      100% { transform: rotate(-20deg); }
    }
    @keyframes footFront {
      0% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    .front-leg-thigh {
      transform-origin: 440px 280px;
      animation: thighFront 1.2s ease-in-out infinite;
    }
    .front-leg-calf {
      transform-origin: 425px 330px;
      animation: calfFront 1.2s ease-in-out infinite;
    }
    .front-leg-foot {
      transform-origin: 430px 415px;
      animation: footFront 1.2s ease-in-out infinite;
    }

    /* Back Leg (Opposite phase) */
    @keyframes thighBack {
      0% { transform: rotate(-24deg); }
      50% { transform: rotate(18deg); }
      100% { transform: rotate(-24deg); }
    }
    @keyframes calfBack {
      0% { transform: rotate(26deg); }
      50% { transform: rotate(-20deg); }
      100% { transform: rotate(26deg); }
    }

    .back-leg-thigh {
      transform-origin: 440px 280px;
      animation: thighBack 1.2s ease-in-out infinite;
    }
    .back-leg-calf {
      transform-origin: 450px 330px;
      animation: calfBack 1.2s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <h1>Pelican on a Bicycle</h1>

  <div class="container">
    <div class="svg-wrapper">
      <svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradients -->
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="60%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#e0f2fe" />
          </linearGradient>

          <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="10%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1e293b" />
          </linearGradient>

          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444" />
            <stop offset="50%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#b91c1c" />
          </linearGradient>

          <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>

          <linearGradient id="beakTipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#ea580c" />
          </linearGradient>

          <!-- Wheel pattern/spokes template -->
          <g id="spokePattern">
            <line x1="0" y1="-55" x2="0" y2="55" stroke="#94a3b8" stroke-width="2" />
            <line x1="-55" y1="0" x2="55" y2="0" stroke="#94a3b8" stroke-width="2" />
            <line x1="-39" y1="-39" x2="39" y2="39" stroke="#94a3b8" stroke-width="2" />
            <line x1="-39" y1="39" x2="39" y2="-39" stroke="#94a3b8" stroke-width="2" />
            <line x1="-51" y1="-21" x2="51" y2="21" stroke="#cbd5e1" stroke-width="1.5" />
            <line x1="-21" y1="-51" x2="21" y2="51" stroke="#cbd5e1" stroke-width="1.5" />
            <line x1="-51" y1="21" x2="51" y2="-21" stroke="#cbd5e1" stroke-width="1.5" />
            <line x1="-21" y1="51" x2="21" y2="-51" stroke="#cbd5e1" stroke-width="1.5" />
          </g>

          <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
          </filter>
        </defs>

        <!-- SKY & DISTANT MOUNTAINS -->
        <rect width="900" height="340" fill="url(#skyGrad)" />
        <path d="M-50 340 L120 220 L280 340 L450 190 L620 340 L780 230 L950 340 Z" fill="#93c5fd" opacity="0.45"/>
        <path d="M50 340 L220 250 L380 340 L580 230 L740 340 L880 260 L980 340 Z" fill="#60a5fa" opacity="0.35"/>

        <!-- CLOUDS (PARALLAX 1) -->
        <g class="clouds">
          <!-- Repeat cloud clusters -->
          <g fill="#ffffff" opacity="0.85">
            <!-- Set 1 -->
            <circle cx="120" cy="80" r="30"/>
            <circle cx="150" cy="70" r="40"/>
            <circle cx="190" cy="80" r="32"/>
            <circle cx="160" cy="95" r="25"/>
            <!-- Set 2 -->
            <circle cx="480" cy="90" r="26"/>
            <circle cx="510" cy="80" r="36"/>
            <circle cx="545" cy="90" r="28"/>
            <!-- Set 3 -->
            <circle cx="820" cy="65" r="32"/>
            <circle cx="855" cy="55" r="45"/>
            <circle cx="895" cy="65" r="35"/>
            <!-- Repeat for seamless loop offset -->
            <circle cx="1120" cy="80" r="30"/>
            <circle cx="1150" cy="70" r="40"/>
            <circle cx="1190" cy="80" r="32"/>
            <circle cx="1480" cy="90" r="26"/>
            <circle cx="1510" cy="80" r="36"/>
            <circle cx="1545" cy="90" r="28"/>
            <circle cx="1820" cy="65" r="32"/>
            <circle cx="1855" cy="55" r="45"/>
            <circle cx="1895" cy="65" r="35"/>
          </g>
        </g>

        <!-- GRASS VERGE -->
        <rect y="315" width="900" height="40" fill="#65a30d" />

        <!-- SCENIC BUSHES & TREES (PARALLAX 2) -->
        <g class="bushes">
          <g fill="#4d7c0f">
            <!-- Bush clusters repeated -->
            <circle cx="60" cy="325" r="22"/>
            <circle cx="85" cy="320" r="28"/>
            <circle cx="115" cy="326" r="20"/>

            <circle cx="340" cy="324" r="24"/>
            <circle cx="370" cy="318" r="30"/>
            <circle cx="400" cy="325" r="22"/>

            <circle cx="680" cy="323" r="26"/>
            <circle cx="710" cy="316" r="32"/>
            <circle cx="745" cy="324" r="24"/>

            <circle cx="860" cy="324" r="20"/>
            <circle cx="885" cy="318" r="26"/>

            <!-- Repeat for wrap -->
            <circle cx="960" cy="325" r="22"/>
            <circle cx="985" cy="320" r="28"/>
            <circle cx="1015" cy="326" r="20"/>
            <circle cx="1240" cy="324" r="24"/>
            <circle cx="1270" cy="318" r="30"/>
            <circle cx="1300" cy="325" r="22"/>
            <circle cx="1580" cy="323" r="26"/>
            <circle cx="1610" cy="316" r="32"/>
            <circle cx="1645" cy="324" r="24"/>
          </g>
        </g>

        <!-- ROAD -->
        <rect y="340" width="900" height="180" fill="url(#roadGrad)" />
        <rect y="340" width="900" height="8" fill="#e2e8f0" opacity="0.6" />

        <!-- ROAD STRIPES -->
        <g class="road-lines">
          <path d="M0 435 L120 435 M200 435 L320 435 M400 435 L520 435 M600 435 L720 435 M800 435 L920 435 M1000 435 L1120 435 M1200 435 L1320 435"
                stroke="#facc15" stroke-width="7" stroke-dasharray="80 60" />
        </g>

        <!-- BICYCLE SHADOW ON ROAD -->
        <ellipse cx="450" cy="442" rx="230" ry="14" fill="#0f172a" opacity="0.38" />

        <!-- ======================= BICYCLE & PELICAN GROUP ======================= -->
        <g id="bikeAndRider">

          <!-- BACK LEG (Behind Bike Frame) -->
          <g class="back-leg-thigh">
            <line x1="440" y1="280" x2="455" y2="335" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
            <g class="back-leg-calf">
              <line x1="455" y1="335" x2="430" y2="400" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
              <!-- Back foot / webbed flipper -->
              <polygon points="420,395 448,397 425,410" fill="#d97706" />
            </g>
          </g>

          <!-- BICYCLE REAR WHEEL -->
          <g id="rearWheel">
            <!-- Tire & Rim -->
            <circle cx="260" cy="380" r="62" fill="none" stroke="#1e293b" stroke-width="14" />
            <circle cx="260" cy="380" r="56" fill="none" stroke="#e2e8f0" stroke-width="4" />
            <!-- Rotating Spokes -->
            <g class="wheel-spokes back-wheel">
              <use href="#spokePattern" x="260" y="380" />
            </g>
            <!-- Hub Cap -->
            <circle cx="260" cy="380" r="9" fill="#475569" />
          </g>

          <!-- BICYCLE FRONT WHEEL -->
          <g id="frontWheel">
            <circle cx="640" cy="380" r="62" fill="none" stroke="#1e293b" stroke-width="14" />
            <circle cx="640" cy="380" r="56" fill="none" stroke="#e2e8f0" stroke-width="4" />
            <!-- Rotating Spokes -->
            <g class="wheel-spokes front-wheel">
              <use href="#spokePattern" x="640" y="380" />
            </g>
            <!-- Hub Cap -->
            <circle cx="640" cy="380" r="9" fill="#475569" />
          </g>

          <!-- BICYCLE FRAME -->
          <g id="bikeFrame" filter="url(#shadow)">
            <!-- Rear stays -->
            <line x1="260" y1="380" x2="380" y2="280" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
            <line x1="260" y1="380" x2="430" y2="380" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>

            <!-- Main Triangle -->
            <!-- Seat tube: BB (430, 380) to Seat Junction (380, 280) -->
            <line x1="430" y1="380" x2="380" y2="280" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>
            <!-- Down tube: BB (430, 380) to Head Tube (570, 240) -->
            <line x1="430" y1="380" x2="570" y2="240" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>
            <!-- Top tube: Seat Junction (380, 280) to Head Tube (570, 240) -->
            <line x1="380" y1="280" x2="570" y2="240" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>

            <!-- Seat Post and Saddle -->
            <line x1="380" y1="280" x2="370" y2="255" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
            <path d="M340 255 C355 250, 395 250, 405 258 C395 264, 355 264, 340 255 Z" fill="#0f172a" />

            <!-- Front Fork & Handlebar -->
            <!-- Front fork from Head Tube to Wheel Axle -->
            <line x1="570" y1="240" x2="640" y2="380" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
            <!-- Stem -->
            <line x1="570" y1="240" x2="560" y2="200" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
            <!-- Handlebars -->
            <path d="M545 205 Q560 195 580 200 Q595 208 590 220" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
            <!-- Grips -->
            <circle cx="588" cy="218" r="4.5" fill="#f59e0b"/>

            <!-- Chain & Chainring -->
            <circle cx="430" cy="380" r="22" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="5 3"/>
            <line x1="260" y1="380" x2="430" y2="380" stroke="#475569" stroke-width="3" stroke-dasharray="6 2"/>
            <line x1="260" y1="375" x2="430" y2="365" stroke="#475569" stroke-width="3" stroke-dasharray="6 2"/>
          </g>

          <!-- PEDAL & CRANK (Synchronized) -->
          <g class="crankset">
            <!-- Crank arm 1 -->
            <line x1="430" y1="380" x2="430" y2="340" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
            <rect x="420" y="335" width="20" height="7" rx="3" fill="#1e293b"/>

            <!-- Crank arm 2 (180 deg opposite) -->
            <line x1="430" y1="380" x2="430" y2="420" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
            <rect x="420" y="418" width="20" height="7" rx="3" fill="#1e293b"/>
          </g>

          <!-- ==================== PELICAN CHARACTER ==================== -->
          <g class="pelican-rider">

            <!-- TAIL FEATHERS -->
            <g class="pelican-tail">
              <path d="M350 255 C330 250, 310 265, 300 270 C315 278, 335 275, 355 265 Z" fill="#cbd5e1" />
              <path d="M355 260 C338 258, 318 274, 308 280 C322 286, 342 280, 360 270 Z" fill="#94a3b8" />
            </g>

            <!-- MAIN BODY -->
            <!-- Soft shaded feathered body -->
            <ellipse cx="430" cy="245" rx="55" ry="42" fill="#f8fafc" filter="url(#shadow)"/>
            <path d="M380 245 C380 280, 435 295, 475 270 C485 255, 480 230, 440 220 C405 215, 380 225, 380 245 Z" fill="#f1f5f9"/>

            <!-- Pelican Cap / Cyclist Helmet -->
            <path d="M495 125 C505 105, 545 105, 560 120 C570 130, 565 140, 500 138 Z" fill="#ef4444" />
            <polygon points="560,123 585,128 560,133" fill="#dc2626" /> <!-- Helmet visor -->
            <ellipse cx="530" cy="116" rx="20" ry="4" fill="#ffffff" opacity="0.6"/>

            <!-- NECK & HEAD -->
            <!-- Graceful S-curved pelican neck -->
            <path d="M465 235 C485 210, 490 170, 505 145 C515 130, 538 125, 550 140 C558 152, 545 175, 528 190 C515 205, 500 235, 485 255 Z" fill="#ffffff"/>

            <!-- HEAD -->
            <circle cx="535" cy="145" r="22" fill="#ffffff"/>

            <!-- EYE & BROW -->
            <circle cx="545" cy="140" r="5.5" fill="#0f172a" />
            <circle cx="547" cy="138" r="2" fill="#ffffff" />
            <!-- Cheerful eyebrow -->
            <path d="M538 133 Q548 130 554 135" stroke="#475569" stroke-width="2.2" stroke-linecap="round" fill="none"/>

            <!-- BEAK UPPER JAW -->
            <path d="M545 138 Q610 142 665 156 Q670 158 660 162 L550 156 Z" fill="url(#beakTipGrad)" />
            <!-- Small beak tip hook -->
            <path d="M665 156 Q670 161 662 165" stroke="#c2410c" stroke-width="2" fill="none" />

            <!-- FAMOUS PELICAN GULAR POUCH (BOUNCING) -->
            <g class="beak-pouch">
              <path d="M550 156 Q595 160 645 162 C625 205, 570 215, 532 172 Z" fill="url(#pouchGrad)" opacity="0.95" />
              <!-- Pouch texture / folds -->
              <path d="M555 165 Q585 190 610 170" stroke="#f59e0b" stroke-width="1.8" fill="none" opacity="0.6"/>
              <path d="M542 167 Q570 195 590 180" stroke="#d97706" stroke-width="1.8" fill="none" opacity="0.5"/>
            </g>

            <!-- WING (ANIMATED / FLAPPING / HOLDING HANDLEBAR) -->
            <g class="pelican-wing">
              <!-- Upper wing / shoulder -->
              <path d="M410 220 Q445 205 480 225 Q450 260 410 245 Z" fill="#e2e8f0" />
              <!-- Feathered layers -->
              <path d="M415 230 C450 220, 480 230, 495 245 C470 270, 430 265, 415 230 Z" fill="#cbd5e1" />
              <!-- Arm extending wing to handlebar -->
              <path d="M470 235 Q530 230 580 220" stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none"/>
              <path d="M470 235 Q530 230 580 220" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" fill="none"/>
              <!-- Wing tip / feathers grabbing handlebar grip -->
              <ellipse cx="583" cy="218" rx="8" ry="6" fill="#cbd5e1" transform="rotate(-15 583 218)"/>
            </g>

            <!-- BREEZY SCARF / BANDANA AROUND NECK -->
            <path d="M515 168 Q500 178 480 180 Q495 190 518 178 Z" fill="#3b82f6" />
            <path d="M480 180 Q460 185 440 182 Q460 192 485 185 Z" fill="#2563eb" />

            <!-- FRONT LEG & WEBBED FOOT (OVER BIKE FRAME) -->
            <g class="front-leg-thigh">
              <line x1="435" y1="275" x2="425" y2="330" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
              <g class="front-leg-calf">
                <line x1="425" y1="330" x2="430" y2="415" stroke="#f59e0b" stroke-width="7.5" stroke-linecap="round"/>
                <!-- Front Foot on Pedal -->
                <g class="front-leg-foot">
                  <!-- Webbed bird foot -->
                  <polygon points="410,412 445,410 440,425 418,423" fill="#ea580c" />
                  <path d="M412 418 L442 416" stroke="#c2410c" stroke-width="1.5" />
                </g>
              </g>
            </g>

          </g> <!-- End Pelican Group -->

        </g> <!-- End Bike & Rider Group -->

        <!-- WIND MOTION LINES (Speed Effect) -->
        <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
          <line x1="680" y1="130" x2="720" y2="130" stroke-dasharray="15 10"/>
          <line x1="695" y1="150" x2="750" y2="150" stroke-dasharray="20 15"/>
          <line x1="670" y1="180" x2="715" y2="180" stroke-dasharray="10 15"/>
          <line x1="655" y1="220" x2="735" y2="220" stroke-dasharray="25 12"/>
        </g>

        <!-- GROUND FOREGROUND FLOWER ACCENTS -->
        <circle cx="80" cy="505" r="4" fill="#facc15"/>
        <circle cx="280" cy="495" r="3.5" fill="#f43f5e"/>
        <circle cx="620" cy="510" r="4.5" fill="#38bdf8"/>
        <circle cx="830" cy="498" r="3.5" fill="#facc15"/>
      </svg>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="btn" id="toggleBtn">Pause</button>
      <span class="speed-label">Speed:</span>
      <button class="btn" id="slowerBtn" style="padding: 6px 14px;">-</button>
      <span id="speedVal" style="font-weight: 700; color: #1e293b; min-width: 38px; text-align: center;">1.0x</span>
      <button class="btn" id="fasterBtn" style="padding: 6px 14px;">+</button>
      <button class="btn" id="bellRingBtn" style="background: #eab308; color: #713f12;">🔔 Ring Bell</button>
    </div>
  </div>

  <script>
    // Interactive controls for animation
    const toggleBtn = document.getElementById('toggleBtn');
    const slowerBtn = document.getElementById('slowerBtn');
    const fasterBtn = document.getElementById('fasterBtn');
    const speedVal = document.getElementById('speedVal');
    const bellBtn = document.getElementById('bellRingBtn');
    const svg = document.getElementById('scene');

    let isPaused = false;
    let currentSpeed = 1.0;

    // Toggle Pause / Play
    toggleBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      const elements = svg.querySelectorAll('*');
      elements.forEach(el => {
        el.style.animationPlayState = isPaused ? 'paused' : 'running';
      });
      toggleBtn.textContent = isPaused ? 'Play' : 'Pause';
      toggleBtn.style.background = isPaused ? '#16a34a' : '#2563eb';
    });

    // Speed Controls
    function updatePlaybackRate(multiplier) {
      currentSpeed = Math.min(Math.max(0.2, currentSpeed * multiplier), 3.0);
      speedVal.textContent = currentSpeed.toFixed(1) + 'x';

      // Base durations
      const baseWheel = 1.2;
      const baseRoad = 0.8;
      const baseClouds = 25.0;
      const baseBushes = 8.0;

      const rate = 1 / currentSpeed;

      document.querySelectorAll('.wheel-spokes, .crankset, .front-leg-thigh, .front-leg-calf, .front-leg-foot, .back-leg-thigh, .back-leg-calf, .pelican-wing')
        .forEach(el => el.style.animationDuration = (baseWheel * rate) + 's');

      document.querySelectorAll('.pelican-rider, .beak-pouch, .pelican-tail')
        .forEach(el => el.style.animationDuration = (0.6 * rate) + 's');

      document.querySelectorAll('.road-lines')
        .forEach(el => el.style.animationDuration = (baseRoad * rate) + 's');

      document.querySelectorAll('.bushes')
        .forEach(el => el.style.animationDuration = (baseBushes * rate) + 's');

      document.querySelectorAll('.clouds')
        .forEach(el => el.style.animationDuration = (baseClouds * rate) + 's');
    }

    slowerBtn.addEventListener('click', () => updatePlaybackRate(0.8));
    fasterBtn.addEventListener('click', () => updatePlaybackRate(1.25));

    // Audio chime effect using Web Audio API on bell click
    bellBtn.addEventListener('click', () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);

        // Visual wiggle feedback on handlebar
        const handlebar = document.querySelector('#bikeFrame');
        if (handlebar) {
          handlebar.style.transition = 'transform 0.1s';
          handlebar.style.transform = 'translateY(-3px)';
          setTimeout(() => handlebar.style.transform = '', 120);
        }
      } catch (e) {
        console.log('AudioContext not allowed or not supported yet');
      }
    });
  </script>
</body>
</html>
