  <meta charset="UTF-8">

  <title>Pelican Pedal Club</title>
  <style>
    :root { color-scheme: light; --ink: #203e40; --paper: #faf7ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    main { max-width: 1440px; margin: auto; padding: 30px 5vw 24px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #203e4025; padding-bottom: 23px; }
    .brand { font-size: 13px; font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 32px; height: 32px; }
    .edition { font-size: 10px; letter-spacing: 2px; }
    .intro { text-align: center; margin: 42px 0 18px; }
    .eyebrow { font-size: 10px; letter-spacing: 3px; font-weight: 700; color: #758a79; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(42px, 6vw, 78px); line-height: 1.05; font-weight: 400; letter-spacing: -3px; margin: 15px 0 16px; }
    h1 em { color: #d4754b; }
    .intro p { color: #748080; font-size: 14px; line-height: 1.6; }
    .scene { overflow: hidden; position: relative; border-radius: 48% 48% 12px 12px / 18% 18% 12px 12px; background: #e7efe6; max-width: 1120px; margin: 26px auto 0; }
    #ride { width: 100%; display: block; height: auto; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 25px 0 30px; }
    button { background: var(--ink); color: white; border: 0; border-radius: 30px; padding: 13px 22px; min-width: 133px; font: 12px Arial, sans-serif; cursor: pointer; }
    button:hover { background: #37605c; }
    button:focus-visible, input:focus-visible { outline: 3px solid #d4754b; outline-offset: 5px; }
    label { display: flex; gap: 12px; align-items: center; font-size: 10px; letter-spacing: 1.2px; }
    input { width: 90px; accent-color: #d4754b; }
    footer { display: flex; justify-content: space-between; border-top: 1px solid #203e4025; padding-top: 20px; font-size: 10px; letter-spacing: 1.4px; color: #758080; }
    .live { display: inline-block; width: 6px; height: 6px; background: #7d9c7e; border-radius: 50%; margin-right: 8px; }
    @media(max-width: 600px) { main { padding: 22px 5vw; } .edition { display: none; } .intro { margin-top: 34px; } h1 { letter-spacing: -2px; } .scene { margin-left: -3vw; margin-right: -3vw; } #ride { width: 150%; margin-left: -25%; } footer { font-size: 8px; letter-spacing: .6px; } .controls { gap: 18px; } }
  </style>

<body>
<main>

    <div class="edition">A LITTLE MOTION. A LITTLE JOY. &nbsp; / &nbsp; NO. 001</div>
  </header>
  <section class="intro"><div class="eyebrow">TAKE THE SCENIC ROUTE</div><h1>Life’s better on <em>two wheels.</em></h1><p>A sea breeze, an open road, and absolutely nowhere to rush.</p></section>

      <desc id="scene-desc">An ivory pelican with a golden beak pedals a terracotta bicycle past dunes and the sea. The wheels spin, its scarf flutters, and the landscape moves.</desc>
      <defs>

        <pattern id="road" width="180" height="50" patternUnits="userSpaceOnUse"><path d="M20 22h45" stroke="#fff9e8" stroke-width="3" stroke-linecap="round"/></pattern>
        <g id="cloud" fill="#faf9ed"><path d="M0 20q4-15 23-12q13-22 34-4q25-3 29 16Z"/></g>
        <g id="grass" stroke="#85957a" stroke-width="2" fill="none" stroke-linecap="round"><path d="M0 0q-1-18-8-24M0 0q3-26 13-34M0 0q8-13 16-14"/></g>
        <g id="wheel"><circle r="67" fill="#f9f3dc" fill-opacity=".35" stroke="#294648" stroke-width="8"/><circle r="58" fill="none" stroke="#fbf7e7" stroke-width="2"/><g class="spokes" stroke="#78918a" stroke-width="1.5"><path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41M-54-22L54 22M-22-54L22 54M-54 22L54-22M-22 54L22-54"/></g><circle r="7" fill="#294648"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0h1120v500H0z"/>
      <circle cx="842" cy="105" r="43" fill="#f2cf87"/>
      <g id="clouds"><use href="#cloud" x="165" y="87"/><use href="#cloud" x="610" y="52" transform="scale(1.2 1)"/><use href="#cloud" x="1000" y="160"/></g>
      <g fill="none" stroke="#78958c" stroke-width="2" stroke-linecap="round"><path d="M892 172q8-8 16 0q8-8 16 0M946 145q6-6 12 0q6-6 12 0"/></g>
      <path d="M0 258q120-29 240-9t255 2t300-5t325 9v132H0" fill="#aecac1"/>
      <g stroke="#d7e5d8" stroke-width="2" stroke-linecap="round"><path d="M35 283h105m46-12h59m615 7h112m-52 23h57M54 319h80m532-48h45m-408 24h90"/></g>
      <path d="M0 333q127-69 282-14t262 4t267-10t309-5v110H0" fill="#c3ccaa"/>
      <path d="M0 364q149-47 324-7t312-8t265-5t219 4v91H0" fill="#e4d9b6"/>
      <path d="M0 407q320-12 560 0t560 0v93H0" fill="#d5c8a5"/>
      <path d="M0 408q320-12 560 0t560 0" fill="none" stroke="#f5edcf" stroke-width="5"/>
      <g id="verge"><use href="#grass" x="130" y="392"/><use href="#grass" x="924" y="387"/><use href="#grass" x="1065" y="399"/><path d="M270 395h14m482-9h13" stroke="#a9ac87" stroke-width="3" stroke-linecap="round"/></g>
      <path id="road-lines" d="M-180 437H1300v50H-180z" fill="url(#road)"/>
      <ellipse cx="560" cy="431" rx="195" ry="13" fill="#6d7865" opacity=".15"/>
      <g id="cyclist">
        <g transform="translate(425 355)"><use href="#wheel" id="rear-wheel"/></g>
        <g transform="translate(682 355)"><use href="#wheel" id="front-wheel"/></g>

        <path d="M425 355l82-114 53 114H425m98-83h121l-84 83" fill="none" stroke="#d78459" stroke-width="5" stroke-linejoin="round"/>
        <path d="M509 250l-9-26m131 7-8-30 27-8q15-3 18 9" fill="none" stroke="#294648" stroke-width="7" stroke-linecap="round"/>
        <path d="M478 222h47q7 0 4 7q-23 7-51 0q-6-4 0-7" fill="#294648"/>
        <path id="far-leg" d="" fill="none" stroke="#c79345" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="bird">
          <path d="M482 212q-34-3-56-39q32 11 56 5" fill="#dbe1cc" stroke="#294648" stroke-width="3" stroke-linejoin="round"/>

          <circle cx="614" cy="97" r="4" fill="#294648"/><circle cx="615" cy="96" r="1" fill="white"/>
          <path d="M595 78q12-15 25-6" fill="none" stroke="#294648" stroke-width="3" stroke-linecap="round"/>

  <div class="controls"><button id="toggle" type="button" aria-pressed="false">Ⅱ &nbsp; Pause ride</button><label for="speed">PACE <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1" aria-label="Cycling speed"></label></div>
  <footer><span><span class="live"></span>A SMALL ESCAPE, ON REPEAT</span><span>POWERED BY PEDALS & SEA AIR</span></footer>
</main>
<script>
  const el = id => document.getElementById(id);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reducedMotion.matches, phase = 0, last = null;
  function updateButton() {
    el('toggle').textContent = paused ? '▶  Resume ride' : 'Ⅱ  Pause ride';
    el('toggle').setAttribute('aria-pressed', String(paused));
  }
  el('toggle').addEventListener('click', () => { paused = !paused; updateButton(); });
  reducedMotion.addEventListener('change', e => { paused = e.matches; updateButton(); });
  function draw() {
    const angle = phase * 180 / Math.PI;
    el('rear-wheel').setAttribute('transform', `rotate(${angle})`);
    el('front-wheel').setAttribute('transform', `rotate(${angle})`);
    el('crank').setAttribute('transform', `rotate(${angle} 560 355)`);
    const x = 560 + 22 * Math.cos(phase), y = 355 + 22 * Math.sin(phase);
    const fx = 560 - 22 * Math.cos(phase), fy = 355 - 22 * Math.sin(phase);
    el('near-leg').setAttribute('d', `M531 237 Q${503 + 10*Math.sin(phase)} 282 ${x} ${y-7}`);
    el('far-leg').setAttribute('d', `M545 239 Q590 286 ${fx} ${fy-5}`);
    el('near-foot').setAttribute('d', `M${x-5} ${y-10}l20 7 7 7h-31Z`);
    el('pedal').setAttribute('d', `M${x-10} ${y+6}h33 M${fx-12} ${fy+5}h25`);
    el('bird').setAttribute('transform', `translate(0 ${Math.sin(phase*2)*1.8})`);
    el('scarf').setAttribute('transform', `rotate(${Math.sin(phase*3)*4} 592 151)`);
    el('road').setAttribute('patternTransform', `translate(${-phase*67%180} 0)`);
    el('clouds').setAttribute('transform', `translate(${-Math.sin(phase*.06)*25} 0)`);
    el('verge').setAttribute('transform', `translate(${-phase*35%1250} 0)`);
  }
  function frame(time) {
    if (last !== null && !paused) phase += Math.min((time-last)/1000, .05) * 2.8 * Number(el('speed').value);
    last = time;
    draw();
    requestAnimationFrame(frame);
  }
  updateButton(); draw(); requestAnimationFrame(frame);
</script>
