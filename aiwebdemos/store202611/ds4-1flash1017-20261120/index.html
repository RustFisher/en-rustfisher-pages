<html lang="zh-CN">
<head>

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #04060c;
    }

    /* 分层天空：4 个时间段 + 天气效果层，用透明度交叉淡化 */
    #sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #04060c;
    }

    .sky-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    body[data-time="morning"] .sky-morning,
    body[data-time="noon"] .sky-noon,
    body[data-time="dusk"] .sky-dusk,
    body[data-time="night"] .sky-night {
      opacity: 1;
    }

    body[data-weather="cloudy"] .sky-cloudy {
      opacity: 1;
    }

    body[data-weather="rain"] .sky-rain {
      opacity: 1;
    }

    body[data-time="night"][data-weather="clear"] .sky-stars {
      opacity: 0.9;
    }

    .sky-morning {
      background: radial-gradient(circle at 46% 46%, #8a92a8 0%, #59647e 38%, #222c3e 76%, #06080e 100%);
    }

    .sky-morning::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 22% 54%, rgba(255, 192, 132, 0.35), transparent 46%);
    }

    .sky-noon {
      background: radial-gradient(circle at 50% 40%, #8fb4d6 0%, #587a9d 44%, #1c2c40 80%, #06090f 100%);
    }

    .sky-dusk {
      background: radial-gradient(circle at 50% 52%, #d98a5e 0%, #8c5872 36%, #39324f 72%, #080810 100%);
    }

    .sky-dusk::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 76% 56%, rgba(255, 140, 80, 0.4), transparent 50%);
    }

    .sky-night {
      background: radial-gradient(circle at 50% 38%, #1b2a4a 0%, #0b1220 46%, #04060c 100%);
    }

    .sky-stars {
      background-image:
        radial-gradient(1.6px 1.6px at 12% 22%, rgba(255, 255, 255, 0.9), transparent 100%),
        radial-gradient(1.2px 1.2px at 26% 14%, rgba(220, 238, 255, 0.8), transparent 100%),
        radial-gradient(1.8px 1.8px at 38% 30%, rgba(255, 255, 255, 0.75), transparent 100%),
        radial-gradient(1.1px 1.1px at 52% 12%, rgba(210, 232, 255, 0.8), transparent 100%),
        radial-gradient(1.5px 1.5px at 64% 26%, rgba(255, 255, 255, 0.7), transparent 100%),
        radial-gradient(1.2px 1.2px at 78% 16%, rgba(230, 240, 255, 0.85), transparent 100%),
        radial-gradient(1.7px 1.7px at 88% 34%, rgba(255, 255, 255, 0.7), transparent 100%),
        radial-gradient(1.1px 1.1px at 18% 42%, rgba(210, 232, 255, 0.65), transparent 100%),
        radial-gradient(1.3px 1.3px at 46% 48%, rgba(255, 255, 255, 0.6), transparent 100%),
        radial-gradient(1.2px 1.2px at 72% 46%, rgba(220, 238, 255, 0.7), transparent 100%),
        radial-gradient(1.5px 1.5px at 92% 56%, rgba(255, 255, 255, 0.55), transparent 100%),
        radial-gradient(1.1px 1.1px at 8% 62%, rgba(255, 255, 255, 0.6), transparent 100%),
        radial-gradient(1.4px 1.4px at 34% 68%, rgba(210, 232, 255, 0.5), transparent 100%),
        radial-gradient(1.2px 1.2px at 58% 72%, rgba(255, 255, 255, 0.45), transparent 100%),
        radial-gradient(1.3px 1.3px at 82% 66%, rgba(230, 240, 255, 0.5), transparent 100%);
    }

    .sky-cloudy {
      background:
        radial-gradient(ellipse at 30% 32%, rgba(150, 160, 175, 0.26), transparent 55%),
        radial-gradient(ellipse at 72% 48%, rgba(120, 132, 150, 0.22), transparent 60%);
    }

    .sky-cloudy::before,
    .sky-cloudy::after {
      content: "";
      position: absolute;
      width: 65vw;
      height: 45vh;
      border-radius: 50%;
      opacity: 0.55;
    }

    .sky-cloudy::before {
      top: -12%;
      left: -8%;
      background: radial-gradient(ellipse at 40% 45%, rgba(150, 166, 190, 0.28), rgba(150, 166, 190, 0) 65%);
      animation: cloud-drift-a 80s ease-in-out infinite alternate;
    }

    .sky-cloudy::after {
      right: -10%;
      bottom: -18%;
      background: radial-gradient(ellipse at 55% 55%, rgba(120, 136, 160, 0.22), rgba(120, 136, 160, 0) 68%);
      animation: cloud-drift-b 95s ease-in-out infinite alternate;
    }

    @keyframes cloud-drift-a {
      to {
        transform: translate3d(5vw, 2vh, 0);
      }
    }

    @keyframes cloud-drift-b {
      to {
        transform: translate3d(-4vw, -2vh, 0);
      }
    }

    .sky-rain {
      background: linear-gradient(180deg, rgba(4, 8, 16, 0.32), rgba(4, 8, 16, 0.5));
    }

    canvas {
      display: block;
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    /* 暗角：只做画面氛围，不是 UI 控件 */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(2, 4, 10, 0.62) 100%);
    }

    /* 入场黑场淡出 */
    #fade {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background: #04060c;
      opacity: 1;
      transition: opacity 1.8s ease;
    }

    #fade.is-hidden {
      opacity: 0;
    }

    /* 左上角时间 / 天气切换 */
    .weather {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 7px 9px;
      border-radius: 16px;
      border: 1px solid rgba(79, 227, 255, 0.22);
      background: rgba(9, 16, 28, 0.66);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translateY(-6px);
      animation: weather-in 0.6s ease 2.1s forwards;
    }

    .atmo-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .weather-label {
      width: 46px;
      flex: none;
      color: rgba(191, 228, 255, 0.5);
      font: 600 9px/1 -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .weather-btn {
      appearance: none;
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: #a9c4d8;
      font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .weather-btn:hover {
      color: #eafffa;
      background: rgba(79, 227, 255, 0.08);
    }

    .weather-btn[aria-pressed="true"] {
      color: #eafffa;
      border-color: rgba(111, 255, 208, 0.55);
      background: rgba(31, 156, 108, 0.24);
      box-shadow: 0 0 12px rgba(87, 255, 207, 0.18);
    }

    .weather-btn:focus-visible {
      outline: 2px solid rgba(111, 255, 208, 0.85);
      outline-offset: 2px;
    }

    @keyframes weather-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .weather {
        top: 12px;
        left: 12px;
        gap: 2px;
        padding: 4px;
      }

      .weather-label {
        display: none;
      }

      .weather-btn {
        padding: 6px 8px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .weather {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .sky-layer {
        transition-duration: 0.01s;
      }

      .sky-cloudy::before,
      .sky-cloudy::after {
        animation: none;
      }
    }

    /* 键盘 / 读屏兜底链接：默认隐藏，聚焦时出现 */
    .blog-fallback {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 20;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(79, 227, 255, 0.35);
      background: rgba(10, 18, 32, 0.88);
      color: #dff5ff;
      font: 500 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0.04em;
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .blog-fallback:focus-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
      outline: 2px solid rgba(111, 255, 208, 0.85);
      outline-offset: 3px;
    }
  </style>
</head>
<body data-time="night" data-weather="rain">
  <div id="sky" aria-hidden="true">
    <div class="sky-layer sky-morning"></div>
    <div class="sky-layer sky-noon"></div>
    <div class="sky-layer sky-dusk"></div>
    <div class="sky-layer sky-night"></div>
    <div class="sky-layer sky-stars"></div>
    <div class="sky-layer sky-cloudy"></div>
    <div class="sky-layer sky-rain"></div>
  </div>

  <div id="vignette"></div>
  <div id="fade"></div>

  <div class="weather" role="group" aria-label="Scene atmosphere">
    <div class="atmo-row" role="group" aria-label="Time">
      <span class="weather-label" aria-hidden="true">Time</span>
      <button class="weather-btn time-btn" type="button" data-time="morning" aria-pressed="false">Morning</button>
      <button class="weather-btn time-btn" type="button" data-time="noon" aria-pressed="false">Noon</button>
      <button class="weather-btn time-btn" type="button" data-time="dusk" aria-pressed="false">Dusk</button>
      <button class="weather-btn time-btn" type="button" data-time="night" aria-pressed="true">Late Night</button>
    </div>
    <div class="atmo-row" role="group" aria-label="Weather">
      <span class="weather-label" aria-hidden="true">Weather</span>
      <button class="weather-btn" type="button" data-weather="rain" aria-pressed="true">Rain</button>
      <button class="weather-btn" type="button" data-weather="cloudy" aria-pressed="false">Cloudy</button>
      <button class="weather-btn" type="button" data-weather="clear" aria-pressed="false">Clear</button>
    </div>
  </div>

  <a
    class="blog-fallback"
    href="https://en.rustfisher.com/aiwebdemos/store-lastest/index.html"
    target="_blank"
    rel="noopener noreferrer"
  >
    Blog ↗
  </a>

  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/controls/OrbitControls.js": "./lib/three/OrbitControls.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
