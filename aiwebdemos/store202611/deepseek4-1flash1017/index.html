<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>雨夜便利店街角 · 微缩模型</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #04060c;
    }

    /* 背景的冷调渐变，让“悬浮模型”有展台感 */
    body {
      background:
        radial-gradient(circle at 50% 38%, #1b2a4a 0%, #0b1220 46%, #04060c 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    /* 暗角：只做画面氛围，不是 UI 控件 */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(2, 4, 10, 0.62) 100%);
    }

    /* 入场黑场淡出 */
    #fade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: #04060c;
      opacity: 1;
      transition: opacity 1.8s ease;
    }

    #fade.is-hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="fade"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/controls/OrbitControls.js": "./lib/three/OrbitControls.js"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
