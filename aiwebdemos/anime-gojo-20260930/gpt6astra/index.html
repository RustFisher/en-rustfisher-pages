  <div class="controls"><span class="note">INFINITY IN MOTION · SVG STUDY</span><div><button id="surge" type="button" aria-pressed="false">AMPLIFY</button> <button id="pause" type="button" aria-pressed="false">PAUSE</button></div></div>
</main>
<script>
  const stage = document.querySelector('.stage');
  const pause = document.getElementById('pause');
  const surge = document.getElementById('surge');
  pause.addEventListener('click', () => {
    const paused = stage.classList.toggle('paused');
    pause.setAttribute('aria-pressed', String(paused));
    pause.textContent = paused ? 'RESUME' : 'PAUSE';
  });
  surge.addEventListener('click', () => {
    const amplified = stage.classList.toggle('surge');
    surge.setAttribute('aria-pressed', String(amplified));
    surge.textContent = amplified ? 'RESTORE' : 'AMPLIFY';
  });
</script>
